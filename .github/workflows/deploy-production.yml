name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to production
    needs: ci
    runs-on: ubuntu-latest
    # The `production` environment requires a reviewer, so this job waits
    # for a manual approval in the Actions tab before any step runs.
    environment:
      name: production
      url: https://${{ vars.PRODUCTION_DOMAIN }}
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm install --global vercel@61

      - name: Migrate production database
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Seed production database
        run: npm run db:seed
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

      - name: Pull Vercel production settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url"

      - run: npx playwright install --with-deps chromium

      - name: Smoke tests
        run: npm run test:smoke
        env:
          BASE_URL: https://${{ vars.PRODUCTION_DOMAIN }}

      - name: How to roll back
        if: failure() && steps.deploy.outcome == 'success'
        run: |
          echo "::error::Smoke tests failed on production."
          echo "Roll back the app to the previous deployment with:"
          echo "  vercel rollback --yes"
          echo "Note: this does not undo database migrations."

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: production-smoke-report
          path: playwright-report/
          retention-days: 7
